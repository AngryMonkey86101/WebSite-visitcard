# Пример конфига nginx для переезда на свой VPS.
# Положите в /etc/nginx/sites-available/site, замените example.com на свой домен,
# сделайте ссылку в sites-enabled и выпустите сертификат: certbot --nginx -d example.com

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    root /var/www/site;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Файлы сборки с хешем в имени можно кешировать надолго.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;
}
